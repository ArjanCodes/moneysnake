[project]
name = "moneysnake"
version = "0.6.0"
description = "Moneybird SDK for Python"
authors = [{ name = "ArjanCodes" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "pydantic>=2.14.2"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "freezegun>=1.5.5",
    "pytest-mock>=3.17.0",
    "pytest>=9.2.0",
    "types-pygments>=2.21.0.20260819",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
